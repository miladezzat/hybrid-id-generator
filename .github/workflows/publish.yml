# npm trusted publisher: miladezzat/hybrid-id-generator, publish.yml, no environment.
name: Publish Package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  check-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check registry version
        id: release
        run: node scripts/check-release.js
  verify:
    needs: check-release
    if: needs.check-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate supported runtime
        run: npm run verify
  build-and-publish:
    needs: [check-release, verify]
    if: needs.check-release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.13.0
      - run: npm ci
      - name: Publish to npm
        run: npm publish --access public
      - name: Verify published version
        run: node scripts/verify-release.js
  verify-existing-release:
    needs: check-release
    if: needs.check-release.outputs.publish == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify existing npm version
        run: node scripts/verify-release.js
