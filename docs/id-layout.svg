<svg xmlns="http://www.w3.org/2000/svg" width="460" height="300" viewBox="0 0 460 300" role="img" aria-labelledby="title"><title id="title">The default ID has 81 bits: 42 timestamp, 12 machine, 5 entropy, 10 random, and 12 sequence</title><rect x="10" y="30" width="440" height="240" rx="24" fill="#111827"/><text x="34" y="68" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2">ONE ID. FIVE FIELDS.</text><text x="34" y="110" fill="white" font-family="system-ui,sans-serif" font-size="32" font-weight="700">81 bits by default</text><rect x="34" y="140" width="194" height="40" rx="7" fill="#6366f1"/><rect x="234" y="140" width="52" height="40" rx="7" fill="#06b6d4"/><rect x="292" y="140" width="24" height="40" rx="7" fill="#f59e0b"/><rect x="322" y="140" width="44" height="40" rx="7" fill="#14b8a6"/><rect x="372" y="140" width="54" height="40" rx="7" fill="#8b5cf6"/><g fill="white" font-family="system-ui,sans-serif" font-size="13" text-anchor="middle"><text x="131" y="165">42</text><text x="260" y="165">12</text><text x="304" y="165">5</text><text x="344" y="165">10</text><text x="399" y="165">12</text></g><g fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11"><text x="34" y="211">Timestamp</text><text x="234" y="211">Machine</text><text x="34" y="235">Entropy + random + sequence</text></g><text x="426" y="245" text-anchor="end" fill="#5eead4" font-family="monospace" font-size="14">bigint → Base62</text></svg>
